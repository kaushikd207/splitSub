[build]
buildCommand = "npm ci && npm run prisma:generate -w @splitsub/api && npm run prisma:migrate:deploy -w @splitsub/api && npm run build -w @splitsub/api"

[deploy]
startCommand = "npm run start -w @splitsub/api"
healthcheckPath = "/services"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
